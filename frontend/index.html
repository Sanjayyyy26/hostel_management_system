<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hostellers | Hostel Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ==================== AUTH VIEW ==================== -->
  <main id="authView" class="auth-page">
    <section class="auth-card" aria-labelledby="formTitle">
      <!-- LOGIN FORM -->
      <div id="loginContent">
        <div class="form-heading">
          <h1>Login</h1>
        </div>

        <div class="role-switch" role="tablist" aria-label="Choose account type">
          <button class="role active" type="button" data-role="student">Student</button>
          <button class="role" type="button" data-role="caretaker">Caretaker</button>
          <button class="role" type="button" data-role="admin">Admin</button>
        </div>

        <form id="loginForm" novalidate>
          <label id="idLabel" for="loginId">Roll Number / Email</label>
          <div class="input-wrap">
            <input id="loginId" type="text" placeholder="Roll Number / Email" required autocomplete="off" />
          </div>
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" type="password" placeholder="Password" required autocomplete="current-password" />
            <button class="password-toggle" type="button" aria-label="Show password">Show</button>
          </div>
          <div id="loginError" class="error-message" hidden></div>
          <button class="primary-button" type="submit">LOGIN</button>
        </form>

        <p class="form-footer">
          New user ?
          <button class="text-button" id="showRegister" type="button">Register</button>
        </p>
      </div>

      <!-- REGISTER FORM -->
      <div id="registerContent" hidden>
        <div class="form-heading">
          <h1>Join Hostellers</h1>
        </div>

        <form id="registerForm" novalidate>
          <label for="regName">Full Name</label>
          <div class="input-wrap">
            <input id="regName" type="text" placeholder="Full Name" required />
          </div>

          <label for="regEmail">Email ID</label>
          <div class="input-wrap">
            <input id="regEmail" type="email" placeholder="Student Mail ID" required />
          </div>

          <label for="regYear">Year</label>
          <div class="input-wrap">
            <select id="regYear" required>
              <option value="">Select year</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </div>

          <label for="regGender">Gender</label>
          <div class="input-wrap">
            <select id="regGender" required>
              <option value="">Select gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>

          <label for="regRoll">Roll Number</label>
          <div class="input-wrap">
            <input id="regRoll" type="text" placeholder="Roll Number" required />
          </div>

          <label for="regNumber">Registration Number</label>
          <div class="input-wrap">
            <input id="regNumber" type="text" placeholder="Registration Number" required />
          </div>

          <label for="regPhone">Mobile Number</label>
          <div class="input-wrap">
            <input id="regPhone" type="tel" placeholder="Mobile Number" required />
          </div>

          <label for="regPassword">Password</label>
          <div class="input-wrap">
            <input id="regPassword" type="password" placeholder="................" required autocomplete="new-password" />
          </div>

          <label for="regConfirmPassword">Confirm Password</label>
          <div class="input-wrap">
            <input id="regConfirmPassword" type="password" placeholder="Confirm password" required autocomplete="new-password" />
          </div>

          <div id="registerError" class="error-message" hidden></div>
          <div id="registerSuccess" class="success-message" hidden></div>

          <button class="primary-button" type="submit">REGISTER</button>
        </form>

        <p class="form-footer">
          Already Registered ?
          <button class="back-button" id="showLogin" type="button">Go back to Login</button>
        </p>
      </div>
    </section>
  </main>

  <!-- ==================== DASHBOARD VIEW ==================== -->
  <div id="dashboardView" class="app-shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-profile" id="sidebarProfile">
        <button class="close-menu" id="closeMenu" type="button">×</button>
        <img id="profileImage" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='%231688d3'><circle cx='32' cy='22' r='14'/><path d='M10 56c0-12 10-22 22-22s22 10 22 22z'/></svg>" alt="Profile" />
        <div>
          <strong id="profileName">User</strong>
          <span id="profileId">ID</span>
          <small id="profileRole">Role</small>
        </div>
      </div>

      <!-- STUDENT NAVIGATION -->
      <nav class="main-nav student-nav" id="studentNav" aria-label="Student navigation">
        <button class="nav-link active" data-page="Dashboard"><span>⌂</span>Dashboard</button>
        <button class="nav-link" data-page="My Profile"><span>👤</span>My Profile</button>
        <button class="nav-link" data-page="Announcements"><span>◫</span>Announcements</button>
        <button class="nav-link" data-page="Complaints"><span>▤</span>Complaints</button>
        <button class="nav-link" data-page="Maintenance"><span>⌁</span>Maintenance</button>
        <button class="nav-link" data-page="Non Local Outing"><span>⇱</span>Non Local Outing</button>
        <button class="nav-link" data-page="Hostel Blocks"><span>▥</span>Hostel Blocks</button>
        <button class="nav-link spacer-link" data-page="Hostel Room Allocation">Hostel Room Allocation</button>
        <button class="nav-link" data-page="Vacating Room">Vacating Room</button>
        <button class="nav-link" data-page="Contact Us">Contact Us</button>
      </nav>

      <!-- CARETAKER NAVIGATION -->
      <nav class="main-nav caretaker-nav" id="caretakerNav" aria-label="Caretaker navigation" hidden>
        <button class="nav-link active" data-page="Dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5L12 3l9 7.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Dashboard
        </button>
        <button class="nav-link" data-page="Announcements">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            <path d="M6 15l2 5"/>
          </svg>
          Announcements
        </button>
        <button class="nav-link" data-page="Complaints">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <line x1="10" y1="9" x2="8" y2="9"/>
          </svg>
          Complaints
        </button>
        <button class="nav-link" data-page="Maintenance">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 3l3 3-9.5 9.5-3-3L18 3z"/>
            <path d="M8.5 12.5l3 3-2 3.5c-.7.7-1.8.9-2.7.5L4 21l-1-1 1.5-2.8c-.4-.9-.2-2 .5-2.7l3.5-2z"/>
            <line x1="3" y1="13" x2="1" y2="14"/>
            <line x1="5" y1="11" x2="4" y2="9"/>
          </svg>
          Maintenance
        </button>
        <button class="nav-link" data-page="Non Local Outing">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <path d="M10 13l4-4 2 2-4 4-2.5.5.5-2.5z"/>
            <line x1="7" y1="17" x2="11" y2="17"/>
          </svg>
          Non Local Outing
        </button>
        <button class="nav-link" data-page="Hostel Blocks">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2" ry="2"/>
            <path d="M9 22v-4h6v4"/>
            <line x1="8" y1="6" x2="10" y2="6"/>
            <line x1="14" y1="6" x2="16" y2="6"/>
            <line x1="8" y1="10" x2="10" y2="10"/>
            <line x1="14" y1="10" x2="16" y2="10"/>
            <line x1="8" y1="14" x2="10" y2="14"/>
            <line x1="14" y1="14" x2="16" y2="14"/>
          </svg>
          Hostel Blocks
        </button>
      </nav>

      <!-- ADMIN NAVIGATION -->
      <nav class="main-nav admin-nav" id="adminNav" aria-label="Admin navigation" hidden>
        <button class="nav-link active" data-page="Dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5L12 3l9 7.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Dashboard
        </button>
        <button class="nav-link" data-page="Announcements">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            <path d="M6 15l2 5"/>
          </svg>
          Announcements
        </button>
        <button class="nav-link" data-page="Complaints">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <line x1="10" y1="9" x2="8" y2="9"/>
          </svg>
          Complaints
        </button>
        <button class="nav-link" data-page="Hostel Blocks">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2" ry="2"/>
            <path d="M9 22v-4h6v4"/>
            <line x1="8" y1="6" x2="10" y2="6"/>
            <line x1="14" y1="6" x2="16" y2="6"/>
            <line x1="8" y1="10" x2="10" y2="10"/>
            <line x1="14" y1="10" x2="16" y2="10"/>
            <line x1="8" y1="14" x2="10" y2="14"/>
            <line x1="14" y1="14" x2="16" y2="14"/>
          </svg>
          Hostel Blocks
        </button>
        <button class="nav-link" data-page="User Management">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          User Management
        </button>
        <button class="nav-link spacer-link" data-page="Hostel Room Allocation">Hostel Room Allocation</button>
        <button class="nav-link" data-page="Hostel Room Evacuation">Hostel Room Evacuation</button>
        <button class="nav-link" data-page="Contact Us">Contact Us</button>
      </nav>

      <nav class="bottom-nav" aria-label="Account navigation">
        <button class="nav-link logout" id="logout">
          <svg class="logout-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Log out
        </button>
      </nav>
    </aside>

    <section class="content-area">
      <header class="topbar">
        <button class="menu-button" id="menuButton" type="button">☰</button>
        <div>
          <p id="topbarDate">TODAY</p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <button class="notification" id="notificationBtn" type="button" aria-label="Notifications" title="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <i id="notificationDot" style="display:none;"></i>
          </button>
        </div>
      </header>

      <div class="page-content" id="pageContent">
        <!-- Content dynamically loaded based on role and page -->
        <div class="loading-spinner" id="loadingSpinner">
          <div class="spinner"></div>
          <p>Loading...</p>
        </div>
      </div>
    </section>
  </div>

  <!-- SESSION TIMEOUT MODAL -->
  <div id="sessionModal" class="modal" hidden>
    <div class="modal-content">
      <h2>Session Expiring</h2>
      <p>Your session will expire in <strong id="modalTimer">00:00</strong></p>
      <p>Do you want to continue?</p>
      <div class="modal-actions">
        <button class="primary-button" id="extendSession">Extend Session</button>
        <button class="secondary-button" id="forceLogout">Logout</button>
      </div>
    </div>
  </div>

  <!-- NOTIFICATIONS MODAL -->
  <div id="notificationsModal" class="modal" hidden>
    <div class="modal-dialog notif-modal-dialog">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:12px;">
        <h2 style="margin:0; font-size:18px;">🔔 Notifications</h2>
        <button class="choice-icon" id="closeNotifModal" type="button" style="border:none; font-size:18px; cursor:pointer;">✕</button>
      </div>
      <div id="notifListContainer" class="notif-list">
        <!-- Loaded dynamically -->
      </div>
      <div class="modal-actions" style="justify-content:space-between; margin-top:16px;">
        <button class="secondary-button" id="markAllNotifRead" type="button" style="font-size:12.5px;">Mark all as read</button>
        <button class="primary-button" id="closeNotifModalBtn" type="button" style="width:auto; padding:8px 20px; font-size:13px;">Close</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  
  <script src="auth.js"></script>
  <script src="pages.js"></script>
  <script src="script.js"></script>
</body>
</html>
